            box-shadow: inset -4px -4px 0 #b91c1c;
        }
        #apple::before {
            content: "";
            position: absolute;

        #apple::after {
            content: "";

<body>

    </nav>

    <div class="header-info">
        <h1>MINI GAME HỨNG TÁO - BÀI TẬP 36</h1>
        <p>Sinh viên: Lê Thái Bình | MSSV: 241A010692</p>
    </div>

    <div class="hud">
        <span class="score-box">Điểm số: <span id="score">0</span></span>
        <span class="lives-box">Mạng sống: <span id="lives">3</span></span>
        <button id="start-btn" type="button">Bắt đầu</button>
    </div>

    <div id="game-container">
        <div id="apple"></div>
        <div id="basket"></div>
        <div id="game-over-banner">
            <h2>Game Over</h2>
            <p id="final-score-text">Điểm của bạn: 0</p>
            <button type="button" id="restart-btn" style="padding: 8px 18px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Chơi lại</button>
        </div>
    </div>

    <p class="controls-hint">Sử dụng phím mũi tên Trái (&larr;) và Phải (&rarr;) để di chuyển giỏ hứng táo.</p>

    <script>
        const gameContainer = document.getElementById('game-container');
        const basket = document.getElementById('basket');
        const apple = document.getElementById('apple');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameOverBanner = document.getElementById('game-over-banner');
        const finalScoreText = document.getElementById('final-score-text');

        const containerWidth = 500;
        const containerHeight = 400;
        const basketWidth = 90;
        const basketHeight = 28;
        const basketBottomOffset = 8;
        const appleSize = 32;

        let basketX = (containerWidth - basketWidth) / 2;
        let appleX = Math.floor(Math.random() * (containerWidth - appleSize));
        let appleY = 0;
        let score = 0;
        let lives = 3;
        let fallSpeed = 2.5;
        let isRunning = false;
        let animationId = null;

        function resetApple() {
            appleY = 0;
            appleX = Math.floor(Math.random() * (containerWidth - appleSize));
            apple.style.top = appleY + 'px';
            apple.style.left = appleX + 'px';
        }

        function updateBasketPosition() {
            if (basketX < 0) basketX = 0;
            if (basketX > containerWidth - basketWidth) {
                basketX = containerWidth - basketWidth;
            }
            basket.style.left = basketX + 'px';
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (!isRunning) return;
                basketX -= 25;
                updateBasketPosition();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (!isRunning) return;
                basketX += 25;
                updateBasketPosition();
            }
        });

        function endGame() {
            isRunning = false;
            cancelAnimationFrame(animationId);
            finalScoreText.textContent = 'Điểm của bạn: ' + score;
            gameOverBanner.style.display = 'flex';
            alert('Game Over! Điểm số của bạn là: ' + score);
        }

        function gameLoop() {
            if (!isRunning) return;

            appleY += fallSpeed;
            apple.style.top = appleY + 'px';

            const basketTop = containerHeight - basketBottomOffset - basketHeight;
            const basketBottom = containerHeight - basketBottomOffset;
            const basketLeft = basketX;
            const basketRight = basketX + basketWidth;

            const appleTop = appleY;
            const appleBottom = appleY + appleSize;
            const appleLeft = appleX;
            const appleRight = appleX + appleSize;

            const isColliding =
                appleBottom >= basketTop &&
                appleTop <= basketBottom &&
                appleRight >= basketLeft &&
                appleLeft <= basketRight;

            if (isColliding) {
                score += 1;
                scoreEl.textContent = score;
                fallSpeed += 0.3;
                resetApple();
            } else if (appleBottom >= containerHeight) {
                lives -= 1;
                livesEl.textContent = lives;
                if (lives <= 0) {
                    livesEl.textContent = 0;
                    endGame();
                    return;
                }
                resetApple();
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            cancelAnimationFrame(animationId);
            score = 0;
            lives = 3;
            fallSpeed = 2.5;
            basketX = (containerWidth - basketWidth) / 2;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            gameOverBanner.style.display = 'none';
            updateBasketPosition();
            resetApple();
            isRunning = true;
            animationId = requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
